name: Documentation CI/CD & Security Audit

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ main-repo-updated, zedda_docs_updated ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Build Dependencies
        run: npm install

      - name: Build Static Documentation
        run: node scripts/build-docs.js

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch' || github.event_name == 'release'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public/docs

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/docs'

  deploy-github-pages:
    needs: build-and-deploy
    if: (github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch' || github.event_name == 'release') && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
