# ──────────────────────────────────────────────────────────────────────────────
# docs-ci.yml — Documentation CI/CD, Synchronization & Security Audit
#
# Builds, tests, and deploys the Zedda static documentation site to GitHub Pages.
# Automatically synchronizes upstream documentation from `Zedda-Labs/Zedda` via:
# 1. Cross-repository `repository_dispatch` events (main-repo-updated, zedda_docs_updated)
# 2. Automated scheduled cron polling (every 6 hours)
# 3. Manual `workflow_dispatch` button in GitHub Actions
# 4. Local branch pushes to main/master
# ──────────────────────────────────────────────────────────────────────────────

name: Documentation CI/CD & Security Audit

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */6 * * *' # Poll upstream Zedda repo every 6 hours for doc updates
  repository_dispatch:
    types: [ main-repo-updated, zedda_docs_updated ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Optional commit SHA from Zedda main repository to build from (defaults to main)'
        required: false
        default: 'main'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "docs-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Static Documentation Site
    runs-on: ubuntu-latest
    steps:
      # Step 1: Harden the GitHub Actions runner security posture
      - name: Harden Runner Environment
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      # Step 2: Checkout the local zedda-docs repository (builder & design system)
      - name: Checkout Docs Builder Repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Step 3: Checkout source content from main Zedda repository IF triggered by dispatch, schedule, or manual run
      - name: Checkout Source Zedda Repository
        if: github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4.2.2
        with:
          repository: ${{ github.event.client_payload.source_repo || 'Zedda-Labs/Zedda' }}
          ref: ${{ github.event.client_payload.commit_sha || inputs.target_sha || 'main' }}
          path: zedda-source

      # Step 4: Synchronize fresh documentation content from Zedda into static-src/content
      - name: Synchronize Documentation Files from Zedda Source
        if: github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "=== Synchronizing documentation content from source repository ==="
          TARGET_SHA="${{ github.event.client_payload.commit_sha || inputs.target_sha || 'main' }}"
          echo "Dispatched Commit SHA: ${TARGET_SHA}"

          # Ensure destination directories exist
          mkdir -p static-src/content/contributing
          mkdir -p static-src/assets

          # Copy images and logos if available in zedda-source
          if [ -d "zedda-source/docs/images" ]; then
            cp -rf zedda-source/docs/images/* static-src/assets/ 2>/dev/null || true
          fi
          if [ -f "zedda-source/docs/logo.png" ]; then
            cp -f zedda-source/docs/logo.png static-src/assets/logo.png
          fi
          if [ -f "zedda-source/docs/logo-dark.png" ]; then
            cp -f zedda-source/docs/logo-dark.png static-src/assets/logo-dark.png
          fi

          # Sync top-level project documentation files (preserve dedicated portal introduction and setup)
          [ -f "zedda-source/CHANGELOG.md" ] && cp -f zedda-source/CHANGELOG.md static-src/content/changelog.md
          [ -f "zedda-source/SECURITY.md" ] && cp -f zedda-source/SECURITY.md static-src/content/contributing/security.md
          [ -f "zedda-source/RELEASING.md" ] && cp -f zedda-source/RELEASING.md static-src/content/contributing/releasing.md
          [ -f "zedda-source/LICENSE" ] && cp -f zedda-source/LICENSE static-src/content/license.md

          # Detect version bump from Python source and update package.json
          if [ -f "zedda-source/python/zedda/__init__.py" ]; then
            UPSTREAM_VERSION=$(grep -o '__version__ = "[^"]*"' zedda-source/python/zedda/__init__.py | cut -d'"' -f2)
            if [ -n "$UPSTREAM_VERSION" ]; then
              echo "Detected upstream Zedda version: $UPSTREAM_VERSION"
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                if (pkg.version !== '$UPSTREAM_VERSION') {
                  pkg.version = '$UPSTREAM_VERSION';
                  fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
                  console.log('Updated package.json version to $UPSTREAM_VERSION');
                }
              "
            fi
          fi

          echo "✅ Documentation content synchronized from Zedda commit ${TARGET_SHA}."

      # Step 4b: Commit and push synchronized documentation back to the repository
      - name: Commit and Push Synchronized Documentation
        if: (github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet static-src/ package.json; then
            TARGET_SHA="${{ github.event.client_payload.commit_sha || inputs.target_sha || 'main' }}"
            git add static-src/ package.json
            git commit -m "chore(sync): synchronize upstream documentation from Zedda (${TARGET_SHA})"
            git push origin ${{ github.ref_name }} || echo "Could not push to branch (branch protection may be enabled). Deployment will continue normally."
          else
            echo "No upstream documentation changes detected to commit."
          fi

      # Step 5: Setup Node.js Environment with NPM Caching enabled
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      # Step 6: Configure GitHub Pages Environment Metadata
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Step 7: Install Build Dependencies deterministically via npm ci
      - name: Install Build Dependencies
        run: npm ci

      # Step 8: Build Static Documentation using existing static site generator
      - name: Build Static Documentation
        run: node scripts/build-docs.js

      # Step 9: Upload Build Artifact for GitHub Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: 'public/docs'

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: build-and-deploy
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || github.event_name == 'release') && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Step 1: Deploy built HTML pages artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

